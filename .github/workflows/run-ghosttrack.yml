name: Run GhostTrack

on:
  workflow_dispatch:  # Manual trigger

jobs:
  run-ghosttrack:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Run GhostTrack
        run: python3 GhostTR.py
